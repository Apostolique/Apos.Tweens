name: Build and test

on:
  push:
    branches:
    - 'main'
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Build
      run: |
        dotnet build Source/Apos.Tweens.csproj -c Release
        dotnet build Source/Apos.Tweens.KNI.csproj -c Release
    - name: Test
      run: dotnet test Tests/Apos.Tweens.Tests.csproj -c Release
